[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "furniture-bench"
version = "0.1.0"
description = "Local experimental furniture detection and catalog retrieval benchmark"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
models = ["torch>=2.2,<3", "transformers>=4.51,<5", "safetensors>=0.4", "sentencepiece>=0.2"]
search = ["faiss-cpu>=1.8,<2"]
documents = ["PyPDF2>=3,<4"]
dev = ["ruff>=0.9"]
plots = ["matplotlib>=3.7,<4"]
layout = ["scipy>=1.10,<2", "matplotlib>=3.7,<4"]
multiview = ["opencv-python-headless==4.10.0.84", "scipy>=1.10,<2", "matplotlib>=3.7,<4"]

[project.scripts]
furniture-bench = "furniture_bench.cli:main"
room-reconstruction = "room_reconstruction.cli:main"
room-layout = "room_layout.cli:main"
room-multiview = "room_multiview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
